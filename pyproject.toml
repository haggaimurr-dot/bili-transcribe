[project]
name = "bili-transcribe"
version = "0.1.0"
description = "B站视频文本转录工具（本地页面 + FunASR）"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "yt-dlp>=2025.1.1",
    "funasr>=1.2.0",
    "modelscope>=1.15",
    "torch>=2.3",
    "torchaudio>=2.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
